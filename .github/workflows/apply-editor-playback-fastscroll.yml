name: apply-editor-playback-fastscroll

on:
  push:
    branches: [ "fix/editor-playback-fastscroll" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/editor-playback-fastscroll
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply_editor_playback_fastscroll_patch.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kapijuja/reader/ReaderActivity.kt app/src/main/java/com/kapijuja/reader/MainActivity.kt
          git commit -m "Fix editor playback and add fast navigation"
          git push origin HEAD:fix/editor-playback-fastscroll
