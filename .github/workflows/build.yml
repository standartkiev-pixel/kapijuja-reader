name: build-kapijuja-reader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_TAG: kapijuja-reader-dev-signing-v1
      SIGNING_ARCHIVE_PASSWORD: ${{ secrets.KAPIJUJA_SIGNING_ARCHIVE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source architecture size
        run: python3 scripts/check_source_size.py

      - name: Restore encrypted persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keystore="$HOME/.android/debug.keystore"
          encrypted="$RUNNER_TEMP/debug.keystore.enc"
          rm -f "$keystore" "$encrypted"

          if [[ -z "${SIGNING_ARCHIVE_PASSWORD:-}" ]]; then
            echo "KAPIJUJA_SIGNING_ARCHIVE_PASSWORD is not configured."
            exit 1
          fi

          asset_names="$(
            gh release view "$SIGNING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' 2>/dev/null || true
          )"

          if grep -Fxq "debug.keystore.enc" <<<"$asset_names"; then
            gh release download "$SIGNING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "debug.keystore.enc" \
              --dir "$RUNNER_TEMP" \
              --clobber
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in "$encrypted" \
              -out "$keystore" \
              -pass env:SIGNING_ARCHIVE_PASSWORD
          elif grep -Fxq "debug.keystore" <<<"$asset_names"; then
            # Migrate the private release asset without changing the signing identity.
            gh release download "$SIGNING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "debug.keystore" \
              --dir "$HOME/.android" \
              --clobber
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in "$keystore" \
              -out "$encrypted" \
              -pass env:SIGNING_ARCHIVE_PASSWORD

            verification="$RUNNER_TEMP/debug.keystore.verify"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in "$encrypted" \
              -out "$verification" \
              -pass env:SIGNING_ARCHIVE_PASSWORD
            cmp -s "$keystore" "$verification"
            rm -f "$verification"

            gh release upload "$SIGNING_TAG" \
              "$encrypted#debug.keystore.enc" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release delete-asset "$SIGNING_TAG" "debug.keystore" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          else
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Kapijuja Reader,O=Kapijuja,C=EU"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in "$keystore" \
              -out "$encrypted" \
              -pass env:SIGNING_ARCHIVE_PASSWORD

            if gh release view "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$SIGNING_TAG" \
                "$encrypted#debug.keystore.enc" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            else
              gh release create "$SIGNING_TAG" \
                "$encrypted#debug.keystore.enc" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Kapijuja Reader encrypted development signing key" \
                --notes "Encrypted signing identity for com.kapijuja.reader." \
                --prerelease
            fi
          fi

          test -s "$keystore"
          keytool -list -v \
            -keystore "$keystore" \
            -storepass android \
            -alias androiddebugkey |
            awk '/SHA256:/{print "Signing certificate SHA-256:",$2; exit}'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bundle Silero v5.5 Android model assets
        shell: bash
        run: |
          set -euo pipefail
          tag="kapijuja-silero-v5_5-android-v1"
          dir="app/src/main/assets/silero"
          mkdir -p "$dir"

          # Use authenticated GitHub CLI downloads so the build works before
          # and after the repository visibility changes.
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$dir" \
            --pattern "silero-v5_5-tts-jit.pt" \
            --pattern "silero-v5_5-metadata.json" \
            --pattern "LICENSE-SILERO.txt" \
            --pattern "README-SILERO-ANDROID.txt" \
            --clobber

          test -s "$dir/silero-v5_5-tts-jit.pt"
          test -s "$dir/silero-v5_5-metadata.json"
          echo "Bundled Silero model bytes: $(stat -c%s "$dir/silero-v5_5-tts-jit.pt")"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name and verify APK
        shell: bash
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/debug/app-debug.apk"
          dst="app/build/outputs/apk/debug/kapijuja-reader.apk"
          test -s "$src"
          cp "$src" "$dst"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$dst"
          sha256sum "$dst"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kapijuja-reader-apk
          path: app/build/outputs/apk/debug/kapijuja-reader.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest test APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/kapijuja-reader.apk"
          tag="kapijuja-reader-latest-test"
          test -s "$apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Kapijuja Reader latest test APK" \
              --notes "Latest signed test APK. The Actions artifact step is kept as a best-effort mirror." \
              --prerelease
          fi
