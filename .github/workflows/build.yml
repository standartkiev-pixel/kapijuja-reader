name: build-kapijuja-reader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_TAG: kapijuja-reader-dev-signing-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keystore="$HOME/.android/debug.keystore"
          rm -f "$keystore"

          if gh release view "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" --pattern "debug.keystore" --dir "$HOME/.android"
          else
            keytool -genkeypair -v               -keystore "$keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Kapijuja Reader,O=Kapijuja,C=EU"
            gh release create "$SIGNING_TAG" "$keystore#debug.keystore"               --repo "$GITHUB_REPOSITORY"               --title "Kapijuja Reader persistent development signing key"               --notes "Persistent signing identity for com.kapijuja.reader. Do not replace."               --prerelease
          fi

          test -s "$keystore"
          keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey |
            awk '/SHA256:/{print "Signing certificate SHA-256:",$2; exit}'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: TEMP probe Silero CIS package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          mkdir -p /tmp/silero-probe
          curl -L --fail --retry 3 -o /tmp/silero-probe/cis.pt https://models.silero.ai/models/tts/ru/v5_cis_base_nostress.pt
          python3 - <<'PY'
          import os, torch, inspect, json, traceback
          p="/tmp/silero-probe/cis.pt"
          print("TORCH", torch.__version__, "FILE", os.path.getsize(p))
          imp=torch.package.PackageImporter(p)
          model=imp.load_pickle("tts_models","model")
          print("MODEL_TYPE",type(model))
          print("MODEL_DICT_KEYS",sorted(model.__dict__.keys()))
          for attr in ["speakers","symbols","speaker_to_package","sample_rate","sample_rates","languages","language_to_id","lang_to_id"]:
              try:
                  v=getattr(model,attr)
                  print("MODEL_ATTR",attr,repr(v)[:30000])
              except Exception as e:
                  print("MODEL_ATTR_ERR",attr,repr(e))
          packs=getattr(model,"packages",[])
          print("PACK_COUNT",len(packs))
          for i,pack in enumerate(packs[:3]):
              print("PACK",i,"TYPE",type(pack))
              print("PACK_KEYS",sorted(getattr(pack,"__dict__",{}).keys()))
              for attr in ["speakers","symbols","speaker_to_id","speaker_id_map","languages","language_to_id","lang_to_id","sample_rate","sample_rates","model"]:
                  try:
                      v=getattr(pack,attr)
                      if attr=="model":
                          print("PACK_ATTR",i,attr,type(v),getattr(v,"_c",None)._method_names() if hasattr(getattr(v,"_c",None),"_method_names") else "")
                      else:
                          print("PACK_ATTR",i,attr,repr(v)[:30000])
                  except Exception as e:
                      print("PACK_ATTR_ERR",i,attr,repr(e))
          try:
              src=inspect.getsource(type(model))
              print("MODEL_SOURCE_BEGIN")
              print(src[:50000])
              print("MODEL_SOURCE_END")
          except Exception as e:
              print("MODEL_SOURCE_ERR",repr(e))
          for i,pack in enumerate(packs[:1]):
              try:
                  src=inspect.getsource(type(pack))
                  print("PACK_SOURCE_BEGIN")
                  print(src[:50000])
                  print("PACK_SOURCE_END")
              except Exception as e:
                  print("PACK_SOURCE_ERR",repr(e))
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name and verify APK
        shell: bash
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/debug/app-debug.apk"
          dst="app/build/outputs/apk/debug/kapijuja-reader.apk"
          test -s "$src"
          cp "$src" "$dst"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$dst"
          sha256sum "$dst"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kapijuja-reader-apk
          path: app/build/outputs/apk/debug/kapijuja-reader.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest test APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/kapijuja-reader.apk"
          tag="kapijuja-reader-latest-test"
          test -s "$apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Kapijuja Reader latest test APK" \
              --notes "Latest signed test APK. The Actions artifact step is kept as a best-effort mirror." \
              --prerelease
          fi
