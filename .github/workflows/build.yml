name: build-kapijuja-reader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_TAG: kapijuja-reader-dev-signing-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keystore="$HOME/.android/debug.keystore"
          rm -f "$keystore"

          if gh release view "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" --pattern "debug.keystore" --dir "$HOME/.android"
          else
            keytool -genkeypair -v               -keystore "$keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Kapijuja Reader,O=Kapijuja,C=EU"
            gh release create "$SIGNING_TAG" "$keystore#debug.keystore"               --repo "$GITHUB_REPOSITORY"               --title "Kapijuja Reader persistent development signing key"               --notes "Persistent signing identity for com.kapijuja.reader."               --prerelease
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kapijuja-Reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
