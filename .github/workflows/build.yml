name: build-kapijuja-reader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_TAG: kapijuja-reader-dev-signing-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keystore="$HOME/.android/debug.keystore"
          rm -f "$keystore"

          if gh release view "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" --pattern "debug.keystore" --dir "$HOME/.android"
          else
            keytool -genkeypair -v               -keystore "$keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Kapijuja Reader,O=Kapijuja,C=EU"
            gh release create "$SIGNING_TAG" "$keystore#debug.keystore"               --repo "$GITHUB_REPOSITORY"               --title "Kapijuja Reader persistent development signing key"               --notes "Persistent signing identity for com.kapijuja.reader. Do not replace."               --prerelease
          fi

          test -s "$keystore"
          keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey |
            awk '/SHA256:/{print "Signing certificate SHA-256:",$2; exit}'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: TEMP probe Silero runtime/model interfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          mkdir -p /tmp/silero-probe
          curl -L --fail --retry 3 -o /tmp/silero-probe/cis.jit https://models.silero.ai/models/tts/ru/v5_cis_base_nostress.jit
          curl -L --fail --retry 3 -o /tmp/silero-probe/v5_5_ru.pt https://models.silero.ai/models/tts/ru/v5_5_ru.pt
          python3 - <<'PY'
          import os, torch, traceback
          print("TORCH", torch.__version__)
          for p in ["/tmp/silero-probe/cis.jit", "/tmp/silero-probe/v5_5_ru.pt"]:
              print("FILE", p, os.path.getsize(p))

          print("\n=== CIS JIT ===")
          m = torch.jit.load("/tmp/silero-probe/cis.jit", map_location="cpu")
          print("TYPE", type(m))
          print("METHODS", m._c._method_names())
          for name in m._c._method_names():
              try:
                  print("SCHEMA", name, m._c._get_method(name).schema)
              except Exception as e:
                  print("SCHEMA_ERR", name, repr(e))
          for attr in ["speakers", "sample_rates", "language", "model_id"]:
              try:
                  v=getattr(m, attr)
                  print("ATTR", attr, type(v), v)
              except Exception as e:
                  print("ATTR_ERR", attr, repr(e))
          try:
              print("CODE_BEGIN")
              print(m.code[:20000])
              print("CODE_END")
          except Exception as e:
              print("CODE_ERR", repr(e))

          print("\n=== V5_5 PACKAGE ===")
          try:
              importer = torch.package.PackageImporter("/tmp/silero-probe/v5_5_ru.pt")
              model = importer.load_pickle("tts_models", "model")
              print("TYPE", type(model))
              print("SPEAKERS", getattr(model, "speakers", None))
              print("SAMPLE_RATES", getattr(model, "sample_rates", None))
              print("DIR_APPLY", [x for x in dir(model) if "tts" in x.lower() or "speaker" in x.lower() or "sample" in x.lower()])
              try:
                  scripted = torch.jit.script(model)
                  print("SCRIPT_SUCCESS", scripted._c._method_names())
                  scripted.save("/tmp/silero-probe/v5_5_scripted.pt")
                  print("SCRIPT_SIZE", os.path.getsize("/tmp/silero-probe/v5_5_scripted.pt"))
              except Exception as e:
                  print("SCRIPT_FAIL", type(e).__name__, str(e)[:12000])
          except Exception as e:
              print("PACKAGE_FAIL", type(e).__name__, str(e)[:12000])
              traceback.print_exc()
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name and verify APK
        shell: bash
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/debug/app-debug.apk"
          dst="app/build/outputs/apk/debug/kapijuja-reader.apk"
          test -s "$src"
          cp "$src" "$dst"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$dst"
          sha256sum "$dst"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kapijuja-reader-apk
          path: app/build/outputs/apk/debug/kapijuja-reader.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest test APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/kapijuja-reader.apk"
          tag="kapijuja-reader-latest-test"
          test -s "$apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Kapijuja Reader latest test APK" \
              --notes "Latest signed test APK. The Actions artifact step is kept as a best-effort mirror." \
              --prerelease
          fi
