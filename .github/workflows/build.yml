name: build-kapijuja-reader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_TAG: kapijuja-reader-dev-signing-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keystore="$HOME/.android/debug.keystore"
          rm -f "$keystore"

          if gh release view "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" --pattern "debug.keystore" --dir "$HOME/.android"
          else
            keytool -genkeypair -v               -keystore "$keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Kapijuja Reader,O=Kapijuja,C=EU"
            gh release create "$SIGNING_TAG" "$keystore#debug.keystore"               --repo "$GITHUB_REPOSITORY"               --title "Kapijuja Reader persistent development signing key"               --notes "Persistent signing identity for com.kapijuja.reader. Do not replace."               --prerelease
          fi

          test -s "$keystore"
          keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey |
            awk '/SHA256:/{print "Signing certificate SHA-256:",$2; exit}'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: TEMP probe Silero v5.5 internals
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          mkdir -p /tmp/silero-probe
          curl -L --fail --retry 3 -o /tmp/silero-probe/v5_5.pt https://models.silero.ai/models/tts/ru/v5_5_ru.pt
          python3 - <<'PY'
          import os, torch, inspect
          p="/tmp/silero-probe/v5_5.pt"
          print("TORCH",torch.__version__,"FILE",os.path.getsize(p))
          imp=torch.package.PackageImporter(p)
          model=imp.load_pickle("tts_models","model")
          print("MODEL_TYPE",type(model))
          print("MODEL_KEYS",sorted(model.__dict__.keys()))
          print("SPEAKERS",repr(getattr(model,"speakers",None)))
          print("SYMBOLS",repr(getattr(model,"symbols",None)))
          print("SPEAKER_TO_PACKAGE",repr(getattr(model,"speaker_to_package",None)))
          packs=getattr(model,"packages",[])
          print("PACK_COUNT",len(packs))
          for i,pack in enumerate(packs):
              print("PACK",i,"TYPE",type(pack))
              print("PACK_KEYS",i,sorted(getattr(pack,"__dict__",{}).keys()))
              for attr in ["speakers","symbols","speaker_to_ids","speaker_to_model","symbol_to_id","alphabet","ext_alph","phons","phon_sep","sos_token","eos_token","wrapped_jit_v","accentor","accentor_public"]:
                  try:
                      v=getattr(pack,attr)
                      if attr in ["accentor","wrapped_jit_v"]:
                          print("PACK_ATTR",i,attr,type(v),repr(v)[:4000])
                      else:
                          print("PACK_ATTR",i,attr,repr(v)[:30000])
                  except Exception as e:
                      print("PACK_ATTR_ERR",i,attr,repr(e))
              models=getattr(pack,"models",[])
              print("INNER_MODEL_COUNT",i,len(models))
              for k,m in enumerate(models):
                  print("INNER",i,k,"TYPE",type(m))
                  try:
                      print("INNER_METHODS",i,k,m._c._method_names())
                      for name in m._c._method_names():
                          try: print("INNER_SCHEMA",i,k,name,m._c._get_method(name).schema)
                          except Exception as e: print("INNER_SCHEMA_ERR",i,k,name,repr(e))
                  except Exception as e:
                      print("INNER_METHOD_ERR",i,k,repr(e))
                  try:
                      print("INNER_CODE_BEGIN",i,k)
                      print(m.code[:30000])
                      print("INNER_CODE_END",i,k)
                  except Exception as e:
                      print("INNER_CODE_ERR",i,k,repr(e))
          try:
              print("PACK_SOURCE_BEGIN")
              print(inspect.getsource(type(packs[0]))[:80000])
              print("PACK_SOURCE_END")
          except Exception as e:
              print("PACK_SOURCE_ERR",repr(e))
          if packs:
              pack=packs[0]
              speaker="eugene"
              print("GET_SPEAKERS",speaker,pack.get_speakers(speaker))
              try:
                  prepared=pack.prepare_tts_model_input("Привет. Это тест.",False,pack.get_speakers(speaker)[0],None)
                  print("PREP_TYPES",[type(x) for x in prepared])
                  print("PREP_VALUES",[repr(x)[:6000] for x in prepared])
              except Exception as e:
                  print("PREP_FAIL",type(e).__name__,str(e)[:10000])
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name and verify APK
        shell: bash
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/debug/app-debug.apk"
          dst="app/build/outputs/apk/debug/kapijuja-reader.apk"
          test -s "$src"
          cp "$src" "$dst"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$dst"
          sha256sum "$dst"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kapijuja-reader-apk
          path: app/build/outputs/apk/debug/kapijuja-reader.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest test APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/kapijuja-reader.apk"
          tag="kapijuja-reader-latest-test"
          test -s "$apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Kapijuja Reader latest test APK" \
              --notes "Latest signed test APK. The Actions artifact step is kept as a best-effort mirror." \
              --prerelease
          fi
