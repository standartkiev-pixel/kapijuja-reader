name: build-kapijuja-reader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_TAG: kapijuja-reader-dev-signing-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keystore="$HOME/.android/debug.keystore"
          rm -f "$keystore"

          if gh release view "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$SIGNING_TAG" --repo "$GITHUB_REPOSITORY" --pattern "debug.keystore" --dir "$HOME/.android"
          else
            keytool -genkeypair -v               -keystore "$keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Kapijuja Reader,O=Kapijuja,C=EU"
            gh release create "$SIGNING_TAG" "$keystore#debug.keystore"               --repo "$GITHUB_REPOSITORY"               --title "Kapijuja Reader persistent development signing key"               --notes "Persistent signing identity for com.kapijuja.reader. Do not replace."               --prerelease
          fi

          test -s "$keystore"
          keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey |
            awk '/SHA256:/{print "Signing certificate SHA-256:",$2; exit}'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bundle Silero v5.5 Android model assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/kapijuja-silero-v5_5-android-v1"
          dir="app/src/main/assets/silero"
          mkdir -p "$dir"

          curl -L --fail --retry 3             -o "$dir/silero-v5_5-tts-jit.pt"             "$base/silero-v5_5-tts-jit.pt"
          curl -L --fail --retry 3             -o "$dir/silero-v5_5-metadata.json"             "$base/silero-v5_5-metadata.json"
          curl -L --fail --retry 3             -o "$dir/LICENSE-SILERO.txt"             "$base/LICENSE-SILERO.txt"
          curl -L --fail --retry 3             -o "$dir/README-SILERO-ANDROID.txt"             "$base/README-SILERO-ANDROID.txt"

          test -s "$dir/silero-v5_5-tts-jit.pt"
          test -s "$dir/silero-v5_5-metadata.json"
          echo "Bundled Silero model bytes: $(stat -c%s "$dir/silero-v5_5-tts-jit.pt")"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name and verify APK
        shell: bash
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/debug/app-debug.apk"
          dst="app/build/outputs/apk/debug/kapijuja-reader.apk"
          test -s "$src"
          cp "$src" "$dst"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$dst"
          sha256sum "$dst"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kapijuja-reader-apk
          path: app/build/outputs/apk/debug/kapijuja-reader.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest test APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/kapijuja-reader.apk"
          tag="kapijuja-reader-latest-test"
          test -s "$apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk#kapijuja-reader.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Kapijuja Reader latest test APK" \
              --notes "Latest signed test APK. The Actions artifact step is kept as a best-effort mirror." \
              --prerelease
          fi
