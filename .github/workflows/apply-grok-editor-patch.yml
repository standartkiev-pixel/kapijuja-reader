name: apply-grok-editor-patch

on:
  push:
    branches: [ "feature/grok-editor-stress-tools" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/grok-editor-stress-tools
          fetch-depth: 0

      - name: Apply guarded ReaderActivity patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_grok_editor_ui_patch.py
          python3 scripts/apply_grok_tag_chunk_patch.py
          python3 scripts/apply_grok_toolbar_extraction_patch.py

      - name: Commit patched ReaderActivity
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kapijuja/reader/ReaderActivity.kt
          git commit -m "Extract Grok editor toolbar from ReaderActivity"
          git push origin HEAD:feature/grok-editor-stress-tools
